name: "Запрос на сайт, логотип или презентацию"
description: "Публичная заявка на разовый дизайн- или веб-проект"
title: "[Запрос] "
body:
  - type: markdown
    attributes:
      value: |
        Внимание: все заявки здесь общедоступны. Не пишите здесь телефон, email, пароли, API-ключи, персональные данные или коммерческие тайны. Размещение заявки не означает заключение договора.
  - type: dropdown
    id: service
    attributes:
      label: Тип работы
      options:
        - Лендинг или сайт-визитка
        - Адаптивная вёрстка по макету
        - Исправление существующего сайта
        - Дизайн или редизайн логотипа
        - Презентация Canva / PowerPoint
        - Редизайн существующей презентации
        - Другое
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Описание задачи
      placeholder: Для сайта — страницы и функции; для логотипа — название и стиль; для презентации — количество слайдов и исходные материалы. Не добавляйте конфиденциальную информацию.
    validations:
      required: true
  - type: dropdown
    id: budget
    attributes:
      label: Примерный бюджет
      options:
        - До 5 000 ₽
        - 5 000–15 000 ₽
        - 15 000–30 000 ₽
        - Более 30 000 ₽
        - Пока неизвестен
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Подтверждение
      options:
        - label: Я понимаю, что заявка публичная, и не размещаю здесь конфиденциальные данные.
          required: true
